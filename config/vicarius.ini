# Sponge Screener under the VICARIUS desktop: python3 screener.py --vicarius
#
# work_root holds the video chunk cache, the converted copies and the bucket
# listing, in work_root/cache (capped at 60 GB, oldest removed first). It must
# sit off the synced drive, and it must exist already or sit directly on a
# mounted disk, so an unmounted disk is refused rather than filled.
#
# runs_root is where VICARIUS mints run folders; leave it unset to use
# <module folder>/inprocess next to this clone.

[vicarius]
work_root = /mnt/tear/sponge_screener
